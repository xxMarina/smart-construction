name: Destroy Infrastructure (Teardown)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DESTROY para confirmar a destruição da infraestrutura na GCP'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Backup pré-destroy do PostgreSQL (via IAP)
        id: backup
        run: |
          PROJECT_ID="projeto-mensal-4"
          ZONE="southamerica-east1-a"
          STATUS=$(gcloud compute instances describe smart-construction-db \
            --zone="$ZONE" \
            --project="$PROJECT_ID" \
            --format="value(status)" 2>/dev/null || echo "NOT_FOUND")

          if [ "$STATUS" != "RUNNING" ]; then
            echo "VM smart-construction-db está com status '$STATUS'; pulando dump pré-destroy."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DUMP_FILE="sc-pre-destroy-${{ github.run_id }}.dump"
          gcloud compute ssh smart-construction-db \
            --zone="$ZONE" \
            --project="$PROJECT_ID" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo docker exec postgres-db pg_dump -U smart_migrator -d smart_construction -Fc > /tmp/sc_pre_destroy.dump && test -s /tmp/sc_pre_destroy.dump"

          gcloud compute scp \
            --zone="$ZONE" \
            --project="$PROJECT_ID" \
            --tunnel-through-iap \
            --quiet \
            "smart-construction-db:/tmp/sc_pre_destroy.dump" "./${DUMP_FILE}"

          gcloud compute ssh smart-construction-db \
            --zone="$ZONE" \
            --project="$PROJECT_ID" \
            --tunnel-through-iap \
            --quiet \
            --command="rm -f /tmp/sc_pre_destroy.dump"

          echo "file=${DUMP_FILE}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Salvar backup pré-destroy como Artifact
        if: steps.backup.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-pre-destroy-${{ github.run_id }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 30

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init & Destroy
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false

      - name: Disparar Deploy em caso de falha no Destroy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
name: Backup and Restore Test (Isolated)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: projeto-mensal-4
  ZONE: southamerica-east1-a

jobs:
  backup-restore-test:
    name: Teste Isolado de Backup e Restauração (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Autenticar na GCP via OIDC (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Gerar dump na VM e transferir via IAP
        id: dump
        run: |
          DUMP_FILE="sc-backup-${{ github.run_id }}.dump"
          gcloud compute ssh smart-construction-db \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo docker exec postgres-db pg_dump -U smart_migrator -d smart_construction -Fc > /tmp/sc_backup_test.dump && test -s /tmp/sc_backup_test.dump"

          ORIG_TABLES=$(gcloud compute ssh smart-construction-db \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo docker exec postgres-db psql -U smart_migrator -d smart_construction -tAc \"SELECT count(*) FROM information_schema.tables WHERE table_schema = 'smart';\"" | tr -d '[:space:]')

          ORIG_PROF=$(gcloud compute ssh smart-construction-db \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo docker exec postgres-db psql -U smart_migrator -d smart_construction -tAc \"SELECT count(*) FROM smart.profissoes;\"" | tr -d '[:space:]')

          gcloud compute scp \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            "smart-construction-db:/tmp/sc_backup_test.dump" "./${DUMP_FILE}"

          gcloud compute ssh smart-construction-db \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="rm -f /tmp/sc_backup_test.dump"

          echo "file=${DUMP_FILE}" >> "$GITHUB_OUTPUT"
          echo "orig_tables=${ORIG_TABLES}" >> "$GITHUB_OUTPUT"
          echo "orig_prof=${ORIG_PROF}" >> "$GITHUB_OUTPUT"

      - name: Restaurar e validar em PostgreSQL 17 isolado no runner
        run: |
          DUMP_FILE="${{ steps.dump.outputs.file }}"
          docker run -d --name pg-restore-test \
            -e POSTGRES_USER=smart_migrator \
            -e POSTGRES_PASSWORD=restore_test \
            -e POSTGRES_DB=smart_construction_restore_test \
            -v "$PWD:/backups:ro" \
            postgres:17

          for i in $(seq 1 30); do
            if docker exec pg-restore-test pg_isready -U smart_migrator -d smart_construction_restore_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec pg-restore-test pg_restore -U smart_migrator -d smart_construction_restore_test --no-owner --no-acl "/backups/${DUMP_FILE}"

          REST_TABLES=$(docker exec pg-restore-test psql -U smart_migrator -d smart_construction_restore_test -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'smart';" | tr -d '[:space:]')
          REST_PROF=$(docker exec pg-restore-test psql -U smart_migrator -d smart_construction_restore_test -tAc "SELECT count(*) FROM smart.profissoes;" | tr -d '[:space:]')

          echo "Tabelas no schema smart (principal): ${{ steps.dump.outputs.orig_tables }} | restaurado: $REST_TABLES"
          echo "Profissoes no banco principal: ${{ steps.dump.outputs.orig_prof }} | restaurado: $REST_PROF"
          docker exec pg-restore-test psql -U smart_migrator -d smart_construction_restore_test -c "\dt smart.*"

          test "${{ steps.dump.outputs.orig_tables }}" = "$REST_TABLES" && test "$REST_TABLES" -gt 0
          test "${{ steps.dump.outputs.orig_prof }}" = "$REST_PROF"
          docker rm -f pg-restore-test

      - name: Salvar arquivo de backup como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-test-${{ github.run_id }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30

  storage-backup-restore-test:
    name: Teste Isolado de Backup e Restauração (SeaweedFS Imagens)
    runs-on: ubuntu-latest
    steps:
      - name: Autenticar na GCP via OIDC (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Gerar arquivo de backup das imagens na VM storage via IAP
        id: storage_dump
        run: |
          ARCHIVE_FILE="sc-storage-backup-${{ github.run_id }}.tar.gz"
          gcloud compute ssh smart-construction-storage \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo tar --warning=no-file-changed -czf /tmp/sc_storage_backup.tar.gz -C /mnt/storage-data editorial private && test -s /tmp/sc_storage_backup.tar.gz"

          ORIG_FILES=$(gcloud compute ssh smart-construction-storage \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo find /mnt/storage-data/editorial /mnt/storage-data/private -type f | wc -l" | tr -d '[:space:]')

          gcloud compute scp \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            "smart-construction-storage:/tmp/sc_storage_backup.tar.gz" "./${ARCHIVE_FILE}"

          gcloud compute ssh smart-construction-storage \
            --zone="${{ env.ZONE }}" \
            --project="${{ env.PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo rm -f /tmp/sc_storage_backup.tar.gz"

          echo "file=${ARCHIVE_FILE}" >> "$GITHUB_OUTPUT"
          echo "orig_files=${ORIG_FILES}" >> "$GITHUB_OUTPUT"

      - name: Restaurar e validar em SeaweedFS isolado no runner
        run: |
          ARCHIVE_FILE="${{ steps.storage_dump.outputs.file }}"
          mkdir -p "$PWD/restore-storage"
          tar -xzf "./${ARCHIVE_FILE}" -C "$PWD/restore-storage"

          REST_FILES=$(find "$PWD/restore-storage/editorial" "$PWD/restore-storage/private" -type f | wc -l | tr -d '[:space:]')
          echo "Arquivos no storage (principal): ${{ steps.storage_dump.outputs.orig_files }} | restaurado: $REST_FILES"
          test "${{ steps.storage_dump.outputs.orig_files }}" = "$REST_FILES" && test "$REST_FILES" -gt 0

          docker run -d --name seaweed-restore-test \
            -v "$PWD/restore-storage/editorial:/data" \
            chrislusf/seaweedfs:4.48 \
            mini -dir=/data -ip.bind=0.0.0.0 -master.port=9333 -volume.port=9340 -filer.port=8888 -s3.port=8333 -master.telemetry=false

          for i in $(seq 1 30); do
            if docker exec seaweed-restore-test wget -q -O /dev/null http://127.0.0.1:9333/cluster/status 2>/dev/null; then
              break
            fi
            sleep 1
          done

          docker exec seaweed-restore-test wget -q -O - http://127.0.0.1:9333/cluster/status
          docker rm -f seaweed-restore-test

      - name: Salvar arquivo de backup das imagens como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storage-backup-test-${{ github.run_id }}
          path: ${{ steps.storage_dump.outputs.file }}
          retention-days: 30

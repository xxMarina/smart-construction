name: Deploy Smart Construction (GCP)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_ID: projeto-mensal-4
  REGION: southamerica-east1
  REGISTRY: southamerica-east1-docker.pkg.dev/projeto-mensal-4/smart-construction

jobs:
  build-web:
    name: 1a. Build & Push Web
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker no Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push da imagem Web (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_ASSETS_BASE_URL=/assets
            ASSETS_PROXY_URL=http://storage:8333/smart-assets
            API_PROXY_URL=http://api:8000
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-api:
    name: 1b. Build & Push API
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker no Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push da imagem API (FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  terraform-apply:
    name: 2. Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      https_url: ${{ steps.tf_output.outputs.https_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache de providers do Terraform
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Validar Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform Init & Plan
        if: github.event_name != 'pull_request'
        id: tf_plan
        working-directory: terraform
        run: |
          terraform init -input=false
          set +e
          terraform plan -detailed-exitcode -input=false -out=tfplan
          EXIT_CODE=$?
          set -e
          echo "exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

      - name: Terraform Apply
        if: github.event_name != 'pull_request' && steps.tf_plan.outputs.exitcode == '2'
        working-directory: terraform
        run: terraform apply -auto-approve -input=false tfplan

      - name: Exportar URL HTTPS do Load Balancer
        if: github.event_name != 'pull_request'
        id: tf_output
        working-directory: terraform
        run: |
          URL=$(terraform output -raw https_url 2>/dev/null | grep -E '^https?://' || true)
          echo "https_url=$URL" >> "$GITHUB_OUTPUT"

  ansible-db:
    name: 3. Ansible DB
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache de pip e coleções Ansible
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ${{ runner.os }}-ansible-v1
          restore-keys: |
            ${{ runner.os }}-ansible-

      - name: Instalar Ansible e coleções GCP/Docker
        run: |
          pip install --quiet ansible google-auth requests
          ansible-galaxy collection install google.cloud community.docker community.general ansible.posix

      - name: Validar sintaxe do Playbook DB
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook-db.yml

      - name: Preparar chave SSH para IAP (DB)
        if: github.event_name != 'pull_request'
        run: gcloud compute ssh smart-construction-db --zone=southamerica-east1-a --project=${{ env.PROJECT_ID }} --tunnel-through-iap --command="true" --quiet

      - name: Executar Playbook DB
        if: github.event_name != 'pull_request'
        working-directory: ansible
        env:
          GCP_AUTH_KIND: application
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook playbook-db.yml

  ansible-storage:
    name: 3b. Ansible Storage
    needs: [terraform-apply, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache de pip e coleções Ansible
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ${{ runner.os }}-ansible-v1
          restore-keys: |
            ${{ runner.os }}-ansible-

      - name: Instalar Ansible e coleções GCP/Docker
        run: |
          pip install --quiet ansible google-auth requests
          ansible-galaxy collection install google.cloud community.docker community.general ansible.posix

      - name: Validar sintaxe do Playbook Storage
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook-storage.yml

      - name: Preparar chave SSH para IAP (Storage)
        if: github.event_name != 'pull_request'
        run: gcloud compute ssh smart-construction-storage --zone=southamerica-east1-a --project=${{ env.PROJECT_ID }} --tunnel-through-iap --command="true" --quiet

      - name: Executar Playbook Storage
        if: github.event_name != 'pull_request'
        working-directory: ansible
        env:
          GCP_AUTH_KIND: application
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook playbook-storage.yml

  ansible-app:
    name: 4. Ansible App
    needs: [terraform-apply, ansible-db, ansible-storage, build-web, build-api]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache de pip e coleções Ansible
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ${{ runner.os }}-ansible-v1
          restore-keys: |
            ${{ runner.os }}-ansible-

      - name: Instalar Ansible e coleções GCP/Docker
        run: |
          pip install --quiet ansible google-auth requests
          ansible-galaxy collection install google.cloud community.docker community.general ansible.posix

      - name: Validar sintaxe do Playbook App
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook-app.yml

      - name: Preparar chave SSH para IAP (App)
        if: github.event_name != 'pull_request'
        run: gcloud compute ssh smart-construction-app-1 --zone=southamerica-east1-a --project=${{ env.PROJECT_ID }} --tunnel-through-iap --command="true" --quiet

      - name: Executar Playbook App
        if: github.event_name != 'pull_request'
        working-directory: ansible
        env:
          GCP_AUTH_KIND: application
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook playbook-app.yml -e "app_url=${{ needs.terraform-apply.outputs.https_url }}"

  smoke-test-https:
    name: 5. Smoke Test HTTPS
    needs: [terraform-apply, ansible-app]
    if: github.event_name != 'pull_request' && needs.terraform-apply.outputs.https_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Executar smoke.mjs contra URL HTTPS
        env:
          SMOKE_BASE_URL: ${{ needs.terraform-apply.outputs.https_url }}
        run: |
          for i in $(seq 1 8); do
            if curl -sf "${SMOKE_BASE_URL}/api/v1/health/ready" >/dev/null 2>&1; then
              node scripts/smoke.mjs
              exit 0
            fi
            echo "Aguardando HTTPS/SSL ficar ativo (tentativa $i/8)..."
            sleep 15
          done
          echo "::warning::Certificado SSL gerenciado ou backend ainda em aquecimento; execute SMOKE_BASE_URL=${SMOKE_BASE_URL} node scripts/smoke.mjs manualmente após ativar."

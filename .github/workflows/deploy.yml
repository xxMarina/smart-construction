name: Deploy Smart Construction (GCP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: projeto-mensal-4
  REGION: southamerica-east1
  REGISTRY: southamerica-east1-docker.pkg.dev/projeto-mensal-4/smart-construction

jobs:
  build-and-push:
    name: 1. Build & Push Docker
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker no Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push da imagem Web (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & Push da imagem API (FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  terraform-apply:
    name: 2. Terraform Apply
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache de providers do Terraform
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validar Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform Init & Apply
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

  ansible-db:
    name: 3. Ansible DB
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache de pip e coleções Ansible
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ${{ runner.os }}-ansible-v1
          restore-keys: |
            ${{ runner.os }}-ansible-

      - name: Instalar Ansible e coleções GCP/Docker
        run: |
          pip install --quiet ansible google-auth requests
          ansible-galaxy collection install google.cloud community.docker community.general ansible.posix

      - name: Validar sintaxe do Playbook DB
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook-db.yml

      - name: Preparar chave SSH para IAP (DB)
        if: github.event_name != 'pull_request'
        run: gcloud compute ssh smart-construction-db --zone=southamerica-east1-a --project=${{ env.PROJECT_ID }} --tunnel-through-iap --command="true" --quiet

      - name: Executar Playbook DB
        if: github.event_name != 'pull_request'
        working-directory: ansible
        env:
          GCP_AUTH_KIND: application
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook playbook-db.yml

  ansible-app:
    name: 4. Ansible App
    needs: ansible-db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Cache de pip e coleções Ansible
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ${{ runner.os }}-ansible-v1
          restore-keys: |
            ${{ runner.os }}-ansible-

      - name: Instalar Ansible e coleções GCP/Docker
        run: |
          pip install --quiet ansible google-auth requests
          ansible-galaxy collection install google.cloud community.docker community.general ansible.posix

      - name: Validar sintaxe do Playbook App
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook-app.yml

      - name: Preparar chave SSH para IAP (App)
        if: github.event_name != 'pull_request'
        run: gcloud compute ssh smart-construction-app-1 --zone=southamerica-east1-a --project=${{ env.PROJECT_ID }} --tunnel-through-iap --command="true" --quiet

      - name: Executar Playbook App
        if: github.event_name != 'pull_request'
        working-directory: ansible
        env:
          GCP_AUTH_KIND: application
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook playbook-app.yml

[defaults]
inventory = inventory.gcp.yml
private_key_file = ~/.ssh/google_compute_engine
host_key_checking = False
timeout = 60

[ssh_connection]
ssh_args = -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin --project=projeto-mensal-4 --zone=southamerica-east1-a" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes
pipelining = True
retries = 3

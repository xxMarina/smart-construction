- name: Configurar e Implantar Smart Construction nas VMs de Aplicação
  hosts: app
  become: true
  vars:
    app_dir: /opt/smart-construction
    repo_url: "https://github.com/xxMarina/smart-construction.git"
    db_private_ip: "{{ hostvars[groups['db'][0]].networkInterfaces[0].networkIP }}"
    storage_private_ip: "{{ hostvars[groups['storage'][0]].networkInterfaces[0].networkIP }}"
    registry_url: "southamerica-east1-docker.pkg.dev/projeto-mensal-4/smart-construction"

  tasks:
    # 1. REPOSITÓRIO DA APLICAÇÃO
    - name: Instalar git caso não esteja presente
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Clonar ou atualizar repositório smart-construction
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true

    # 3. AUTENTICAÇÃO NO GCP ARTIFACT REGISTRY
    - name: Autenticar Docker no Artifact Registry
      ansible.builtin.command: "gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet"
      changed_when: false

    # 3. BUSCA DE SEGREDOS NO GCP SECRET MANAGER
    - name: Buscar segredos no Secret Manager
      ansible.builtin.command: "gcloud secrets versions access latest --secret={{ item }}"
      loop:
        - sc-db-password
        - sc-s3-access-key
        - sc-s3-secret-key
      register: fetched_secrets
      changed_when: false
      no_log: true

    - name: Mapear segredos em dicionário
      ansible.builtin.set_fact:
        secrets_map: "{{ secrets_map | default({}) | combine({item.item: item.stdout}) }}"
      loop: "{{ fetched_secrets.results }}"
      no_log: true

    # 5. GERAR .SECRETS NATIVOS + SINCRONIZAR COM SECRET MANAGER
    - name: Limpar senhas antigas do banco antes de regenerar secrets
      ansible.builtin.file:
        path: "{{ app_dir }}/.secrets/backend/{{ item }}"
        state: absent
      loop:
        - migration-password
        - api-password

    - name: Executar geradores nativos de secrets do projeto (backend-setup e storage-setup)
      ansible.builtin.command:
        cmd: "docker compose --profile tools run --rm {{ item }}"
        chdir: "{{ app_dir }}"
      loop:
        - backend-setup
        - storage-setup

    - name: Sincronizar senhas do banco no diretório .secrets/backend com o Secret Manager
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.secrets/backend/{{ item }}"
        content: "{{ secrets_map['sc-db-password'] }}\n"
        mode: "0444"
      loop:
        - migration-password
        - api-password
      no_log: true

    - name: Sincronizar chaves S3 do backend com o Secret Manager
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.secrets/backend/{{ item.file }}"
        content: "{{ secrets_map[item.secret] }}\n"
        mode: "0444"
      loop:
        - { file: "s3-api-access-key", secret: "sc-s3-access-key" }
        - { file: "s3-api-secret-key", secret: "sc-s3-secret-key" }
      no_log: true

    # 5. GERAR .ENV E OVERRIDE DE PRODUÇÃO (VPC: DB + STORAGE CENTRALIZADO)
    - name: Gerar arquivo .env seguro na VM
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          BIND_ADDRESS=0.0.0.0
          HTTP_PORT=8081
          SMART_API_ENVIRONMENT=production
          SMART_API_ALLOWED_ORIGINS=["{{ app_url }}"]
          REGISTRATIONS_UI_ENABLED=true
          SMART_API_REGISTRATIONS_ENABLED=true
          SMART_API_TERMS_VERSION=termos-lab-2026-11-11
          SMART_API_PRIVACY_VERSION=privacidade-lab-2026-11-11
      no_log: true

    - name: Gerar docker-compose.override.yml para produção na GCP
      ansible.builtin.copy:
        dest: "{{ app_dir }}/docker-compose.override.yml"
        mode: "0644"
        content: |
          services:
            gateway:
              ports: !override
                - "0.0.0.0:8081:80"
                - "0.0.0.0:80:80"
            web:
              image: {{ registry_url }}/web:latest
              build: !reset null
              extra_hosts:
                - "storage:{{ storage_private_ip }}"
              depends_on: !override
                api:
                  condition: service_healthy
            api-migrate:
              image: {{ registry_url }}/api:latest
              build: !reset null
              environment:
                SMART_API_DB_HOST: {{ db_private_ip }}
              depends_on: !reset []
            api:
              image: {{ registry_url }}/api:latest
              build: !reset null
              environment:
                SMART_API_DB_HOST: {{ db_private_ip }}
                SMART_API_S3_ENDPOINT_URL: "http://{{ storage_private_ip }}:8334"
                SMART_API_ALLOWED_ORIGINS: '["{{ app_url }}"]'
              depends_on: !override
                api-migrate:
                  condition: service_completed_successfully

    # 6. MIGRATIONS E APLICAÇÃO STATELESS
    - name: Executar migrations Alembic na VM primária
      ansible.builtin.command:
        cmd: "docker compose run --rm --pull always api-migrate"
        chdir: "{{ app_dir }}"
      run_once: true

    - name: Subir Backend FastAPI e aguardar ficar saudavel
      block:
        - name: Iniciar servico api com retry
          community.docker.docker_compose_v2:
            project_src: "{{ app_dir }}"
            services:
              - api
            state: present
            pull: always
            dependencies: false
            wait: true
            wait_timeout: 300
          register: api_up
          retries: 2
          delay: 10
          until: api_up is succeeded
      rescue:
        - name: Coletar logs do container api em caso de falha
          ansible.builtin.command: docker logs --tail 80 smart-construction-api-1
          register: api_logs
          changed_when: false
          failed_when: false

        - name: Exibir logs do container api e falhar
          ansible.builtin.fail:
            msg: "{{ api_logs.stdout_lines | default([]) + api_logs.stderr_lines | default([]) }}"

    - name: Subir Gateway Nginx e Frontend Next.js
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        services:
          - gateway
          - web
        state: present
        pull: always
        dependencies: false
        remove_orphans: true

- name: Configurar e Implantar Smart Construction nas VMs de Aplicação
  hosts: app
  become: true
  vars:
    app_dir: /opt/smart-construction
    repo_url: "https://github.com/LaercioMLB/smart-construction.git"
    db_private_ip: "10.10.0.4"
    registry_url: "southamerica-east1-docker.pkg.dev/projeto-mensal-4/smart-construction"
    app_url: "https://34.54.146.153.sslip.io"

  tasks:
    # 1. PERSISTÊNCIA DO ARMAZENAMENTO (SeaweedFS)
    - name: Formatar disco persistente storage-data (apenas se estiver vazio)
      community.general.filesystem:
        fstype: ext4
        dev: /dev/disk/by-id/google-storage-data

    - name: Garantir diretório de montagem /mnt/storage-data
      ansible.builtin.file:
        path: /mnt/storage-data
        state: directory
        mode: "0755"

    - name: Montar volume persistente storage-data
      ansible.posix.mount:
        path: /mnt/storage-data
        src: /dev/disk/by-id/google-storage-data
        fstype: ext4
        state: mounted

    - name: Criar subdiretórios para buckets editorial e privado
      ansible.builtin.file:
        path: "/mnt/storage-data/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - editorial
        - private

    # 2. REPOSITÓRIO DA APLICAÇÃO
    - name: Instalar git caso não esteja presente
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Clonar ou atualizar repositório smart-construction
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true

    # 3. AUTENTICAÇÃO NO GCP ARTIFACT REGISTRY
    - name: Autenticar Docker no Artifact Registry
      ansible.builtin.command: "gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet"
      changed_when: false

    # 4. BUSCA DE SEGREDOS NO GCP SECRET MANAGER
    - name: Buscar segredos no Secret Manager
      ansible.builtin.command: "gcloud secrets versions access latest --secret={{ item }}"
      loop:
        - sc-db-password
        - sc-jwt-secret
        - sc-admin-password
        - sc-s3-access-key
        - sc-s3-secret-key
      register: fetched_secrets
      changed_when: false
      no_log: true

    - name: Mapear segredos em dicionário
      ansible.builtin.set_fact:
        secrets_map: "{{ secrets_map | default({}) | combine({item.item: item.stdout}) }}"
      loop: "{{ fetched_secrets.results }}"
      no_log: true

    # 5. GERAR .SECRETS NATIVOS + SINCRONIZAR COM SECRET MANAGER
    - name: Limpar senhas antigas do banco antes de regenerar secrets
      ansible.builtin.file:
        path: "{{ app_dir }}/.secrets/backend/{{ item }}"
        state: absent
      loop:
        - migration-password
        - api-password

    - name: Executar geradores nativos de secrets do projeto (backend-setup e storage-setup)
      ansible.builtin.command:
        cmd: "docker compose --profile tools run --rm {{ item }}"
        chdir: "{{ app_dir }}"
      loop:
        - backend-setup
        - storage-setup

    - name: Sincronizar senhas do banco no diretório .secrets/backend com o Secret Manager
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.secrets/backend/{{ item }}"
        content: "{{ secrets_map['sc-db-password'] }}\n"
        mode: "0444"
      loop:
        - migration-password
        - api-password
      no_log: true

    - name: Sincronizar chaves S3 do storage editorial com o Secret Manager
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.secrets/storage/{{ item.file }}"
        content: "{{ secrets_map[item.secret] }}"
        mode: "0444"
      loop:
        - { file: "access-key", secret: "sc-s3-access-key" }
        - { file: "secret-key", secret: "sc-s3-secret-key" }
        - { file: "admin-password", secret: "sc-admin-password" }
      no_log: true

    # 6. GERAR .ENV E OVERRIDE DE PRODUÇÃO (ARTIFACT REGISTRY + BANCO EXTERNO 10.10.0.4)
    - name: Gerar arquivo .env seguro na VM
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          BIND_ADDRESS=0.0.0.0
          HTTP_PORT=8081
          SMART_API_ENVIRONMENT=production
          SMART_API_ALLOWED_ORIGINS=["{{ app_url }}"]
          JWT_SECRET={{ secrets_map['sc-jwt-secret'] }}
          ADMIN_PASSWORD={{ secrets_map['sc-admin-password'] }}
      no_log: true

    - name: Gerar docker-compose.override.yml para produção na GCP
      ansible.builtin.copy:
        dest: "{{ app_dir }}/docker-compose.override.yml"
        mode: "0644"
        content: |
          services:
            gateway:
              ports: !override
                - "0.0.0.0:8081:80"
                - "0.0.0.0:80:80"
            web:
              image: {{ registry_url }}/web:latest
              build: !reset null
            api-migrate:
              image: {{ registry_url }}/api:latest
              build: !reset null
              environment:
                SMART_API_DB_HOST: {{ db_private_ip }}
              depends_on: !reset []
            api:
              image: {{ registry_url }}/api:latest
              build: !reset null
              environment:
                SMART_API_DB_HOST: {{ db_private_ip }}
                SMART_API_ALLOWED_ORIGINS: '["{{ app_url }}"]'
              depends_on:
                api-migrate:
                  condition: service_completed_successfully
                private-storage-init:
                  condition: service_completed_successfully
            private-storage-init:
              image: {{ registry_url }}/api:latest
            storage:
              volumes: !override
                - /mnt/storage-data/editorial:/data
                - ./docker/storage:/opt/storage:ro
            private-storage:
              volumes: !override
                - /mnt/storage-data/private:/data
                - ./backend/docker:/opt/backend-storage:ro

    # 7. SUBIR STORAGE, MIGRATIONS E APLICAÇÃO COMPLETA
    - name: Subir armazenamentos SeaweedFS (editorial e privado)
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        services:
          - storage
          - private-storage
        state: present
        recreate: always

    - name: Executar migrations Alembic na VM primária
      ansible.builtin.command:
        cmd: "docker compose run --rm api-migrate"
        chdir: "{{ app_dir }}"
      run_once: true

    - name: Inicializar buckets do SeaweedFS nas VMs de aplicação
      ansible.builtin.command:
        cmd: "docker compose run --rm {{ item }}"
        chdir: "{{ app_dir }}"
      loop:
        - private-storage-init
        - storage-init

    - name: Subir Gateway Nginx, Frontend Next.js e Backend FastAPI
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        services:
          - gateway
          - web
          - api
        state: present
        pull: always
        remove_orphans: true
